name: flyleaf
services:
  dunarea-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      FLYLEAF_AIRPORT_ID: dunarea
      FLYLEAF_AIRPORT_NAME: Aeroportul Dunărea
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FLYLEAF_OPENAI_MODEL: ${FLYLEAF_OPENAI_MODEL:-gpt-6-luna}
      FLYLEAF_OPENAI_REDACTION_MODEL: ${FLYLEAF_OPENAI_REDACTION_MODEL:-}
      FLYLEAF_EXCHANGE_URL: http://dunarea-gateway:8082
      FLYLEAF_EXCHANGE_TOKEN_FILE: /run/secrets/gateway_token
      FLYLEAF_AUTH_MODE: oidc
      FLYLEAF_OIDC_ISSUER: http://127.0.0.1:8180/realms/dunarea
      FLYLEAF_OIDC_INTERNAL_ISSUER: http://dunarea-identity:8080/realms/dunarea
      FLYLEAF_KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${FLYLEAF_DUNAREA_PROVISIONING_SECRET:-flyleaf-dunarea-provisioning-demo}
      FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL: ${FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL:-false}
      FLYLEAF_OIDC_CLIENT_ID: flyleaf-web
      FLYLEAF_OIDC_REDIRECT_URI: http://127.0.0.1:8080/api/auth/oidc/callback
      FLYLEAF_OIDC_FRONTEND_URL: http://127.0.0.1:8080/
    secrets:
      - source: dunarea-token
        target: gateway_token
    volumes:
      - dunarea-state:/state
    networks: [dunarea-private, dunarea-connector, llm-egress]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  dunarea-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      API_HOST: dunarea-api
    ports: ['127.0.0.1:8080:80']
    networks: [dunarea-private, dunarea-web-edge]
    depends_on: [dunarea-api]
  carpati-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      FLYLEAF_AIRPORT_ID: carpati
      FLYLEAF_AIRPORT_NAME: Aeroportul Carpați
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FLYLEAF_OPENAI_MODEL: ${FLYLEAF_OPENAI_MODEL:-gpt-6-luna}
      FLYLEAF_OPENAI_REDACTION_MODEL: ${FLYLEAF_OPENAI_REDACTION_MODEL:-}
      FLYLEAF_CORPUS_DIR: /app/peer-data
      FLYLEAF_SEED_DOCUMENTS: 'false'
      FLYLEAF_EXCHANGE_URL: http://carpati-gateway:8082
      FLYLEAF_EXCHANGE_TOKEN_FILE: /run/secrets/gateway_token
      FLYLEAF_AUTH_MODE: oidc
      FLYLEAF_OIDC_ISSUER: http://127.0.0.1:8181/realms/carpati
      FLYLEAF_OIDC_INTERNAL_ISSUER: http://carpati-identity:8080/realms/carpati
      FLYLEAF_KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${FLYLEAF_CARPATI_PROVISIONING_SECRET:-flyleaf-carpati-provisioning-demo}
      FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL: ${FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL:-false}
      FLYLEAF_OIDC_CLIENT_ID: flyleaf-web
      FLYLEAF_OIDC_REDIRECT_URI: http://127.0.0.1:8081/api/auth/oidc/callback
      FLYLEAF_OIDC_FRONTEND_URL: http://127.0.0.1:8081/
    secrets:
      - source: carpati-token
        target: gateway_token
    volumes:
      - carpati-state:/state
    networks: [carpati-private, carpati-connector, carpati-llm-egress]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  carpati-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      API_HOST: carpati-api
    ports: ['127.0.0.1:8081:80']
    networks: [carpati-private, carpati-web-edge]
    depends_on: [carpati-api]
  dunarea-identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180
      FLYLEAF_KEYCLOAK_PROVISIONING_SECRET: ${FLYLEAF_DUNAREA_PROVISIONING_SECRET:-flyleaf-dunarea-provisioning-demo}
      KC_HTTP_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports: ['127.0.0.1:8180:8080']
    volumes:
      - dunarea-identity:/opt/keycloak/data
      - ./deploy/keycloak/dunarea-realm.json:/opt/keycloak/data/import/dunarea-realm.json:ro
      - ./deploy/keycloak/theme/flyleaf:/opt/keycloak/themes/flyleaf:ro
    networks: [dunarea-private, dunarea-web-edge]
    restart: unless-stopped
  carpati-identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:8181
      FLYLEAF_KEYCLOAK_PROVISIONING_SECRET: ${FLYLEAF_CARPATI_PROVISIONING_SECRET:-flyleaf-carpati-provisioning-demo}
      KC_HTTP_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports: ['127.0.0.1:8181:8080']
    volumes:
      - carpati-identity:/opt/keycloak/data
      - ./deploy/keycloak/carpati-realm.json:/opt/keycloak/data/import/carpati-realm.json:ro
      - ./deploy/keycloak/theme/flyleaf:/opt/keycloak/themes/flyleaf:ro
    networks: [carpati-private, carpati-web-edge]
    restart: unless-stopped
  dunarea-gateway:
    image: nginx:1.28-alpine
    entrypoint: ['sh', '/gateway-entrypoint.sh']
    environment:
      LOCAL_GATEWAY: dunarea-gateway
      PEER_GATEWAY: carpati-gateway
      API_HOST: dunarea-api
    secrets:
      - source: dunarea-token
        target: gateway_token
    volumes:
      - ./deploy/gateway-entrypoint.sh:/gateway-entrypoint.sh:ro
      - ./deploy/gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./.runtime/exchange/dunarea.crt:/certs/airport.crt:ro
      - ./.runtime/exchange/dunarea.key:/certs/airport.key:ro
      - ./.runtime/exchange/ca.crt:/certs/ca.crt:ro
    networks: [dunarea-connector, airport-exchange]
    depends_on: [dunarea-api, carpati-api]
  carpati-gateway:
    image: nginx:1.28-alpine
    entrypoint: ['sh', '/gateway-entrypoint.sh']
    environment:
      LOCAL_GATEWAY: carpati-gateway
      PEER_GATEWAY: dunarea-gateway
      API_HOST: carpati-api
    secrets:
      - source: carpati-token
        target: gateway_token
    volumes:
      - ./deploy/gateway-entrypoint.sh:/gateway-entrypoint.sh:ro
      - ./deploy/gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./.runtime/exchange/carpati.crt:/certs/airport.crt:ro
      - ./.runtime/exchange/carpati.key:/certs/airport.key:ro
      - ./.runtime/exchange/ca.crt:/certs/ca.crt:ro
    networks: [carpati-connector, airport-exchange]
    depends_on: [dunarea-api, carpati-api]
networks:
  llm-egress:
  carpati-llm-egress:
  dunarea-web-edge:
  carpati-web-edge:
  dunarea-private:
    internal: true
  carpati-private:
    internal: true
  dunarea-connector:
    internal: true
  carpati-connector:
    internal: true
  airport-exchange:
    internal: true
volumes:
  dunarea-state:
  carpati-state:
  dunarea-identity:
  carpati-identity:
secrets:
  dunarea-token:
    file: ./.runtime/exchange/dunarea.token
  carpati-token:
    file: ./.runtime/exchange/carpati.token
