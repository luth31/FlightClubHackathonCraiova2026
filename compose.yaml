name: flyleaf
services:
  craiova-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      FLYLEAF_AIRPORT_ID: craiova
      FLYLEAF_AIRPORT_NAME: Aeroportul Craiova
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FLYLEAF_OPENAI_MODEL: ${FLYLEAF_OPENAI_MODEL:-gpt-6-luna}
      FLYLEAF_OPENAI_REDACTION_MODEL: ${FLYLEAF_OPENAI_REDACTION_MODEL:-}
      FLYLEAF_EXCHANGE_URL: http://craiova-gateway:8082
      FLYLEAF_EXCHANGE_TOKEN_FILE: /run/secrets/gateway_token
      FLYLEAF_AUTH_MODE: oidc
      FLYLEAF_OIDC_ISSUER: http://127.0.0.1:8180/realms/craiova
      FLYLEAF_OIDC_INTERNAL_ISSUER: http://craiova-identity:8080/realms/craiova
      FLYLEAF_KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${FLYLEAF_CRAIOVA_PROVISIONING_SECRET:-flyleaf-craiova-provisioning-demo}
      FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL: ${FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL:-false}
      FLYLEAF_OIDC_CLIENT_ID: flyleaf-web
      FLYLEAF_OIDC_REDIRECT_URI: http://127.0.0.1:8080/api/auth/oidc/callback
      FLYLEAF_OIDC_FRONTEND_URL: http://127.0.0.1:8080/
    secrets:
      - source: craiova-token
        target: gateway_token
    volumes:
      - craiova-state:/state
    networks: [craiova-private, craiova-connector, llm-egress]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  craiova-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      API_HOST: craiova-api
    ports: ['127.0.0.1:8080:80']
    networks: [craiova-private, craiova-web-edge]
    depends_on: [craiova-api]
  sibiu-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      FLYLEAF_AIRPORT_ID: sibiu
      FLYLEAF_AIRPORT_NAME: Aeroportul Sibiu
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FLYLEAF_OPENAI_MODEL: ${FLYLEAF_OPENAI_MODEL:-gpt-6-luna}
      FLYLEAF_OPENAI_REDACTION_MODEL: ${FLYLEAF_OPENAI_REDACTION_MODEL:-}
      FLYLEAF_CORPUS_DIR: /app/peer-data
      FLYLEAF_SEED_DOCUMENTS: 'false'
      FLYLEAF_EXCHANGE_URL: http://sibiu-gateway:8082
      FLYLEAF_EXCHANGE_TOKEN_FILE: /run/secrets/gateway_token
      FLYLEAF_AUTH_MODE: oidc
      FLYLEAF_OIDC_ISSUER: http://127.0.0.1:8181/realms/sibiu
      FLYLEAF_OIDC_INTERNAL_ISSUER: http://sibiu-identity:8080/realms/sibiu
      FLYLEAF_KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${FLYLEAF_SIBIU_PROVISIONING_SECRET:-flyleaf-sibiu-provisioning-demo}
      FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL: ${FLYLEAF_KEYCLOAK_ACTIVATION_EMAIL:-false}
      FLYLEAF_OIDC_CLIENT_ID: flyleaf-web
      FLYLEAF_OIDC_REDIRECT_URI: http://127.0.0.1:8081/api/auth/oidc/callback
      FLYLEAF_OIDC_FRONTEND_URL: http://127.0.0.1:8081/
    secrets:
      - source: sibiu-token
        target: gateway_token
    volumes:
      - sibiu-state:/state
    networks: [sibiu-private, sibiu-connector, sibiu-llm-egress]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  sibiu-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      API_HOST: sibiu-api
    ports: ['127.0.0.1:8081:80']
    networks: [sibiu-private, sibiu-web-edge]
    depends_on: [sibiu-api]
  craiova-identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180
      FLYLEAF_PUBLIC_URL: http://127.0.0.1:8080
      FLYLEAF_KEYCLOAK_PROVISIONING_SECRET: ${FLYLEAF_CRAIOVA_PROVISIONING_SECRET:-flyleaf-craiova-provisioning-demo}
      KC_HTTP_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports: ['127.0.0.1:8180:8080']
    volumes:
      - craiova-identity:/opt/keycloak/data
      - ./deploy/keycloak/craiova-realm.json:/opt/keycloak/data/import/craiova-realm.json:ro
      - ./deploy/keycloak/theme/flyleaf:/opt/keycloak/themes/flyleaf:ro
    networks: [craiova-private, craiova-web-edge]
    restart: unless-stopped
  sibiu-identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:8181
      FLYLEAF_PUBLIC_URL: http://127.0.0.1:8081
      FLYLEAF_KEYCLOAK_PROVISIONING_SECRET: ${FLYLEAF_SIBIU_PROVISIONING_SECRET:-flyleaf-sibiu-provisioning-demo}
      KC_HTTP_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports: ['127.0.0.1:8181:8080']
    volumes:
      - sibiu-identity:/opt/keycloak/data
      - ./deploy/keycloak/sibiu-realm.json:/opt/keycloak/data/import/sibiu-realm.json:ro
      - ./deploy/keycloak/theme/flyleaf:/opt/keycloak/themes/flyleaf:ro
    networks: [sibiu-private, sibiu-web-edge]
    restart: unless-stopped
  craiova-gateway:
    image: nginx:1.28-alpine
    entrypoint: ['sh', '/gateway-entrypoint.sh']
    environment:
      LOCAL_GATEWAY: craiova-gateway
      PEER_GATEWAY: sibiu-gateway
      API_HOST: craiova-api
    secrets:
      - source: craiova-token
        target: gateway_token
    volumes:
      - ./deploy/gateway-entrypoint.sh:/gateway-entrypoint.sh:ro
      - ./deploy/gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./.runtime/exchange/craiova.crt:/certs/airport.crt:ro
      - ./.runtime/exchange/craiova.key:/certs/airport.key:ro
      - ./.runtime/exchange/ca.crt:/certs/ca.crt:ro
    networks: [craiova-connector, airport-exchange]
    depends_on: [craiova-api, sibiu-api]
  sibiu-gateway:
    image: nginx:1.28-alpine
    entrypoint: ['sh', '/gateway-entrypoint.sh']
    environment:
      LOCAL_GATEWAY: sibiu-gateway
      PEER_GATEWAY: craiova-gateway
      API_HOST: sibiu-api
    secrets:
      - source: sibiu-token
        target: gateway_token
    volumes:
      - ./deploy/gateway-entrypoint.sh:/gateway-entrypoint.sh:ro
      - ./deploy/gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./.runtime/exchange/sibiu.crt:/certs/airport.crt:ro
      - ./.runtime/exchange/sibiu.key:/certs/airport.key:ro
      - ./.runtime/exchange/ca.crt:/certs/ca.crt:ro
    networks: [sibiu-connector, airport-exchange]
    depends_on: [craiova-api, sibiu-api]
networks:
  llm-egress:
  sibiu-llm-egress:
  craiova-web-edge:
  sibiu-web-edge:
  craiova-private:
    internal: true
  sibiu-private:
    internal: true
  craiova-connector:
    internal: true
  sibiu-connector:
    internal: true
  airport-exchange:
    internal: true
volumes:
  craiova-state:
  sibiu-state:
  craiova-identity:
  sibiu-identity:
secrets:
  craiova-token:
    file: ./.runtime/exchange/craiova.token
  sibiu-token:
    file: ./.runtime/exchange/sibiu.token
