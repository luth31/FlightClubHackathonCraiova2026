resolver 127.0.0.11 valid=5s ipv6=off;
log_format aerodesk '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log aerodesk;
upstream airport_api {
    zone airport_api 64k;
    server ${API_HOST}:8000 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/exchange/ { return 404; }
    location /api/ {
        proxy_pass http://airport_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
