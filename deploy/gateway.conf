resolver 127.0.0.11 valid=5s ipv6=off;
log_format flyleaf_gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log flyleaf_gateway;
upstream local_airport_api {
    zone local_airport_api 64k;
    server ${API_HOST}:8000 resolve;
}
upstream peer_airport_gateway {
    zone peer_airport_gateway 64k;
    server ${PEER_GATEWAY}:8443 resolve;
}
map $ssl_client_s_dn $peer_airport {
    default "";
    "CN=craiova-gateway" craiova;
    "CN=sibiu-gateway" sibiu;
}
server {
    listen 8443 ssl;
    server_name ${LOCAL_GATEWAY};
    ssl_certificate /certs/airport.crt;
    ssl_certificate_key /certs/airport.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($peer_airport = "") { return 403; }
    location /exchange/ {
        limit_except GET { deny all; }
        proxy_pass http://local_airport_api/api/exchange/;
        proxy_set_header Authorization "Bearer ${GATEWAY_TOKEN}";
        proxy_set_header X-Peer-Airport $peer_airport;
        proxy_set_header X-Requester-Id $http_x_requester_id;
        proxy_set_header X-Requester-Roles $http_x_requester_roles;
        proxy_set_header X-Requester-Department $http_x_requester_department;
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_no_cache 1;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
server {
    listen 8082;
    if ($http_authorization != "Bearer ${GATEWAY_TOKEN}") { return 401; }
    location /outgoing/ {
        limit_except GET { deny all; }
        proxy_pass https://peer_airport_gateway/exchange/;
        proxy_ssl_certificate /certs/airport.crt;
        proxy_ssl_certificate_key /certs/airport.key;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name ${PEER_GATEWAY};
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Requester-Id $http_x_requester_id;
        proxy_set_header X-Requester-Roles $http_x_requester_roles;
        proxy_set_header X-Requester-Department $http_x_requester_department;
        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_buffering off;
        proxy_no_cache 1;
    }
    location / { return 404; }
}
