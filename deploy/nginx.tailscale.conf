resolver 127.0.0.11 valid=5s ipv6=off;
log_format flyleaf '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log flyleaf;
upstream airport_api {
    zone airport_api 64k;
    server ${API_HOST}:8000 resolve;
}
upstream airport_identity {
    zone airport_identity 64k;
    server ${IDENTITY_HOST}:8080 resolve;
}
# Derive forwarding headers from deployment configuration, never client input.
map "${PUBLIC_ORIGIN}" $public_scheme {
    ~^https:// https;
    default http;
}
map "${PUBLIC_ORIGIN}" $public_host {
    ~^https?://(?<configured_host>[^/]+)$ $configured_host;
}
map "${PUBLIC_ORIGIN}" $public_port {
    ~^https?://[^/:]+:(?<configured_port>[0-9]+)$ $configured_port;
    ~^https:// 443;
    default 80;
}
server {
    listen 80;
    access_log /var/log/nginx/access.log flyleaf;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/exchange/ { return 404; }
    # SOP analysis can take longer than a document lookup; keep other API timeouts unchanged.
    location = /api/operations/strategy-analysis {
        proxy_pass http://airport_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://airport_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location ~ ^/auth/(realms/${AIRPORT_ID}/|resources/) {
        proxy_pass http://airport_identity;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Port $public_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
    # Administration and other realms stay off the shared web entry point.
    location /auth/ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
