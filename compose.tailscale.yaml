# Opt-in HTTPS entrances to the existing flyleaf stack. No separate data volumes.
name: flyleaf
services:
  craiova-api:
    environment:
      FLYLEAF_OIDC_EXTRA_ORIGINS: '["${FLYLEAF_CRAIOVA_PUBLIC_URL:?Set .env.tailscale}"]'
  craiova-identity:
    environment:
      KC_HOSTNAME: ''
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
  craiova-tailweb:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ['127.0.0.1:18080:80']
    environment:
      API_HOST: craiova-api
      IDENTITY_HOST: craiova-identity
      AIRPORT_ID: craiova
      PUBLIC_ORIGIN: ${FLYLEAF_CRAIOVA_PUBLIC_URL}
    volumes:
      - ./deploy/nginx.tailscale.conf:/etc/nginx/templates/default.conf.template:ro
    networks: [craiova-private, craiova-web-edge]
    depends_on: [craiova-api, craiova-identity]
  sibiu-api:
    environment:
      FLYLEAF_OIDC_EXTRA_ORIGINS: '["${FLYLEAF_SIBIU_PUBLIC_URL:?Set .env.tailscale}"]'
  sibiu-identity:
    environment:
      KC_HOSTNAME: ''
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
  sibiu-tailweb:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ['127.0.0.1:18081:80']
    environment:
      API_HOST: sibiu-api
      IDENTITY_HOST: sibiu-identity
      AIRPORT_ID: sibiu
      PUBLIC_ORIGIN: ${FLYLEAF_SIBIU_PUBLIC_URL}
    volumes:
      - ./deploy/nginx.tailscale.conf:/etc/nginx/templates/default.conf.template:ro
    networks: [sibiu-private, sibiu-web-edge]
    depends_on: [sibiu-api, sibiu-identity]
